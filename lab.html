<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>COSMIC FALL — Character Lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23070a12'/><circle cx='8' cy='8' r='3' fill='%23ff2f8a'/></svg>" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0d12; font-family: 'Trebuchet MS', system-ui, sans-serif; }
    #lab { position: fixed; inset: 0; display: block; }
    #ui { position: fixed; top: 0; left: 0; }
    .panel {
      margin: 16px; padding: 14px 14px 18px; width: 250px;
      background: rgba(10, 14, 20, 0.72); border: 1px solid rgba(120,150,200,0.2);
      border-radius: 6px; color: #cdd6e6; backdrop-filter: blur(4px);
    }
    .panel .h { font-size: 10px; letter-spacing: 0.25em; color: #6b7688; margin: 12px 0 6px; }
    .panel .h:first-child { margin-top: 0; }
    .panel .row { display: flex; gap: 6px; }
    .panel button {
      flex: 1; padding: 8px 6px; font-size: 11px; letter-spacing: 0.12em;
      background: rgba(30,38,52,0.7); color: #cdd6e6; border: 1px solid rgba(120,150,200,0.2);
      border-radius: 3px; cursor: pointer; transition: all 0.15s; margin-top: 6px;
    }
    .panel button:hover { background: rgba(60,90,150,0.4); border-color: #9fe0ff; }
    .panel button.active { background: rgba(70,110,180,0.6); border-color: #9fe0ff; color: #fff; }
    .panel .sl { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; font-size: 11px; color: #9fb0c8; letter-spacing: 0.08em; }
    .panel .sl input { width: 100%; accent-color: #ff2f8a; }
    .panel .hint { margin-top: 14px; font-size: 10px; color: #4d5668; letter-spacing: 0.1em; }
    .panel a.back { display: inline-block; margin-top: 10px; font-size: 11px; color: #7fb0d8; text-decoration: none; letter-spacing: 0.1em; }
    .panel a.back:hover { color: #9fe0ff; }
    #fatal { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; color: #ff8a8a; background: #0a0d12; font-size: 16px; padding: 40px; text-align: center; }
    .title-tag { position: fixed; bottom: 14px; right: 18px; color: #3d4658; font-size: 11px; letter-spacing: 0.2em; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="lab"></canvas>
  <div id="ui"></div>
  <div class="title-tag">COSMIC FALL · CHARACTER LAB</div>
  <div id="fatal"></div>

  <!-- Meshy-generated body: commit the GLB to assets/models/ and uncomment.
       A "BODY: PROCEDURAL / MESHY" toggle then appears in the Lab panel.
  <script>window.LAB_MONSTER_MODEL = './assets/models/monster.glb';</script>
  -->

  <script type="module" src="./src/lab.js"></script>
</body>
</html>
